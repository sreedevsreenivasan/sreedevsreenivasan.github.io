<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="PBtew5snmvwHYjejeto8e5mLvWfPJBgJSOGydXRB9h0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sreedev Sreenivasan | Portfolio</title>
    <style>
        :root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f8fafc;
  --accent: #38bdf8;
  --button: #0ea5e9;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
}

.container {
  background: var(--card);
  padding: 2.5rem;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  max-width: 400px;
  width: 90%;
  border: 1px solid rgba(255,255,255,0.1);
}

h1 {
  font-size: 1.8rem;
  margin-bottom: 0.5rem;
  color: var(--accent);
}

p {
  color: #94a3b8;
  margin-bottom: 2rem;
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.btn {
  text-decoration: none;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  transition: all 0.3s ease;
  display: inline-block;
}

/* Primary Button */
.btn-primary {
  background-color: var(--button);
  color: white;
}

.btn-primary:hover {
  background-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);
}

/* Secondary Button */
.btn-secondary {
  border: 2px solid var(--button);
  color: var(--button);
}

.btn-secondary:hover {
  background-color: rgba(14, 165, 233, 0.1);
  transform: translateY(-3px);
}
    </style>
</head>
<body>
  <div class="container">
    <h1>Sreedev Sreenivasan</h1>
    <p>CS Engineering Student @ MES College <br> Kochi, Kerala</p>
    
    <div class="button-group">
      <a href="https://github.com/sreedevsreenivasan/My-Coding-Journey" class="btn btn-primary">
        🚀 View My Projects
      </a>
      
      <a href="GAME_DEV_JAVA-1.pdf" class="btn btn-secondary" target="_blank">
        📄 Read Project Report
      </a>
    </div>
  </div>
</body>
</html>
